<head>

  <link rel="preload" href="/fonts/rubik-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <title>8Ball</title>
  <style>
    /* ========== FONT (self hosted, works offline) ========== */
    @font-face {
      font-family: 'Rubik';
      font-style: normal;
      font-weight: 300 900;
      font-display: swap;
      src: url('/fonts/rubik-hebrew-wght-normal.woff2') format('woff2');
      unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
    }

    @font-face {
      font-family: 'Rubik';
      font-style: normal;
      font-weight: 300 900;
      font-display: swap;
      src: url('/fonts/rubik-latin-wght-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* ========== TOKENS ========== */
    :root {
      --bg-top: #0d001a;
      --bg-bottom: #1a002e;
      --pink: #ff00cc;
      --violet: #9b5cff;
      --cyan: #00d4ff;
      --text: #ffffff;
      --muted: #b9a8d6;

      /* four text sizes, no more */
      --t-title: clamp(40px, 11vw, 60px);
      --t-answer: clamp(18px, 5.4vw, 26px);
      --t-body: clamp(17px, 4.6vw, 20px);
      --t-small: clamp(13px, 3.6vw, 15px);

      --ball: min(68vw, 42dvh, 340px);
      --ring-gap: 14px;

      /* the colour of the current answer; pink until there is one */
      --tone: var(--pink);
      --tone-rgb: 255, 0, 204;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ========== SKELETON: header / ball / footer ========== */
    #app {
      height: 100dvh;
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      padding:
        calc(env(safe-area-inset-top, 0px) + clamp(24px, 6dvh, 56px))
        24px
        calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 4dvh, 40px));
      text-align: center;
    }

    /* ========== TITLE ========== */
    .title {
      font-size: var(--t-title);
      font-weight: 900;
      line-height: 1;
      color: var(--pink);
      letter-spacing: 0.08em;
      text-shadow:
        0 0 10px var(--pink),
        0 0 30px rgba(255, 0, 204, 0.5),
        0 0 60px rgba(255, 0, 204, 0.2);
      animation: titleGlow 3s ease-in-out infinite alternate;
      direction: ltr;
    }

    @keyframes titleGlow {
      from { text-shadow: 0 0 10px var(--pink), 0 0 30px rgba(255, 0, 204, 0.5), 0 0 60px rgba(255, 0, 204, 0.2); }
      to   { text-shadow: 0 0 15px var(--pink), 0 0 40px rgba(255, 0, 204, 0.6), 0 0 80px rgba(255, 0, 204, 0.3); }
    }

    .subtitle {
      margin-top: 10px;
      font-size: var(--t-small);
      color: var(--muted);
    }

    /* ========== STAGE ========== */
    .stage {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .ball-container {
      position: relative;
      animation: float 5.5s ease-in-out infinite alternate;
    }

    /* soft light behind the ball, takes the colour of the answer */
    .ball-container::before {
      content: '';
      position: absolute;
      inset: -45%;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--tone-rgb), 0.17) 0%, transparent 62%);
      pointer-events: none;
    }

    @keyframes float {
      from { transform: translateY(5px); }
      to   { transform: translateY(-7px); }
    }

    .neon-ring {
      width: calc(var(--ball) + var(--ring-gap) * 2);
      height: calc(var(--ball) + var(--ring-gap) * 2);
      border-radius: 50%;
      border: 2px solid rgba(var(--tone-rgb), 0.55);
      box-shadow:
        0 0 18px rgba(var(--tone-rgb), 0.35),
        0 0 40px rgba(var(--tone-rgb), 0.18),
        inset 0 0 18px rgba(var(--tone-rgb), 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.5s, border-color 0.5s;
    }

    /* before the first answer the ball gives a little "shake me" wiggle */
    .fresh .neon-ring {
      animation: nudge 6s ease-in-out 2.5s infinite;
    }

    @keyframes nudge {
      0%, 84%, 100% { transform: rotate(0deg) translateX(0); }
      87% { transform: rotate(-5deg) translateX(-6px); }
      90% { transform: rotate(5deg) translateX(6px); }
      93% { transform: rotate(-3deg) translateX(-4px); }
      96% { transform: rotate(2deg) translateX(2px); }
    }

    .crystal-ball {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      font: inherit;
      color: inherit;
      width: var(--ball);
      height: var(--ball);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(96, 60, 150, 0.7), rgba(20, 10, 40, 0.96) 70%);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      container-type: size;
      transition: transform 0.2s;
    }

    .crystal-ball:active {
      transform: scale(0.97);
    }

    .crystal-ball:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: calc(var(--ring-gap) + 6px);
    }

    @media (hover: hover) {
      .ball-container:hover .neon-ring {
        border-color: rgba(var(--tone-rgb), 0.9);
        box-shadow:
          0 0 26px rgba(var(--tone-rgb), 0.55),
          0 0 60px rgba(var(--tone-rgb), 0.3),
          inset 0 0 22px rgba(var(--tone-rgb), 0.2);
      }
    }

    /* glint */
    .crystal-ball::before {
      content: '';
      position: absolute;
      top: 12%;
      left: 18%;
      width: 30%;
      height: 20%;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.28) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(5px);
      pointer-events: none;
      z-index: 7;
    }

    /* fog */
    .fog {
      position: absolute;
      inset: -10%;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      filter: blur(6px);
      transition: opacity 0.8s ease-out;
    }

    .fog-1 {
      background: radial-gradient(ellipse at 38% 55%, rgba(180, 100, 255, 0.34) 0%, transparent 60%);
      animation: fogDrift1 10s ease-in-out infinite alternate;
    }

    .fog-2 {
      background: radial-gradient(ellipse at 64% 42%, rgba(0, 212, 255, 0.2) 0%, transparent 55%);
      animation: fogDrift2 8s ease-in-out infinite alternate;
    }

    .fog-3 {
      background: radial-gradient(ellipse at 50% 72%, rgba(255, 0, 204, 0.18) 0%, transparent 50%);
      animation: fogDrift1 13s ease-in-out infinite alternate-reverse;
    }

    @keyframes fogDrift1 {
      0%   { transform: translate(-8%, 4%) scale(1); }
      50%  { transform: translate(6%, -6%) scale(1.08); }
      100% { transform: translate(-4%, 8%) scale(0.95); }
    }

    @keyframes fogDrift2 {
      0%   { transform: translate(6%, -4%) scale(1.04); }
      50%  { transform: translate(-8%, 6%) scale(0.94); }
      100% { transform: translate(4%, -8%) scale(1.06); }
    }

    /* ========== THE EYE ========== */
    .eye {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .iris {
      width: 50%;
      height: 50%;
      border-radius: 50%;
      background: radial-gradient(circle, #9ff0ff 0%, #00d4ff 26%, #7b2fff 62%, #2a0f55 100%);
      box-shadow: 0 0 24px rgba(0, 212, 255, 0.55), 0 0 60px rgba(123, 47, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: look 8s ease-in-out infinite;
      transition: opacity 0.5s;
    }

    .pupil {
      position: relative;
      width: 42%;
      height: 42%;
      border-radius: 50%;
      background: #0d001a;
      transition: transform 0.3s;
    }

    .pupil::after {
      content: '';
      position: absolute;
      top: 16%;
      left: 20%;
      width: 25%;
      height: 25%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
    }

    /* idle: looks around */
    @keyframes look {
      0%, 18%   { transform: translate(0, 0); }
      28%, 44%  { transform: translate(-18%, 5%); }
      54%, 70%  { transform: translate(17%, -7%); }
      80%, 100% { transform: translate(0, 0); }
    }

    /* shaking: startled, the pupil darts around */
    .shaking .iris { animation: dart 0.36s linear infinite; }
    .shaking .pupil { transform: scale(1.25); }

    @keyframes dart {
      0%   { transform: translate(-22%, -10%); }
      25%  { transform: translate(20%, 12%); }
      50%  { transform: translate(-10%, 18%); }
      75%  { transform: translate(16%, -16%); }
      100% { transform: translate(-22%, -10%); }
    }

    /* eyelids: blink when idle, close for the answer */
    .lid {
      position: absolute;
      left: 0;
      right: 0;
      height: 51%;
      z-index: 6;
      pointer-events: none;
      transform: scaleY(0);
      transition: transform 0.32s ease-in;
    }

    .lid-top {
      top: 0;
      transform-origin: 50% 0;
      background: radial-gradient(circle at 35% 60%, #3a2468, #1c0f38 70%);
      border-bottom: 2px solid rgba(var(--tone-rgb), 0.35);
    }

    .lid-bottom {
      bottom: 0;
      transform-origin: 50% 100%;
      background: linear-gradient(180deg, #1c0f38, #140a28);
    }

    .ball-container:not(.shaking):not(.reveal) .lid {
      animation: blink 4.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 91%, 97%, 100% { transform: scaleY(0); }
      94% { transform: scaleY(1); }
    }

    .reveal .lid { transform: scaleY(1); }

    /* maybe: the eye stays half open */
    .tone-maybe.reveal .lid { transform: scaleY(0.9); }
    .tone-maybe.reveal .iris { opacity: 0.28; }

    /* ========== STARS ========== */
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .sky i {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.6); }
      50%      { opacity: 1; transform: scale(1); }
    }

    /* answer */
    #answer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16%;
      font-size: var(--t-answer);
      font-size: clamp(17px, 9.5cqw, 30px);
      font-weight: 600;
      line-height: 1.3;
      text-wrap: balance;
      color: var(--text);
      text-shadow: 0 0 10px rgba(var(--tone-rgb), 0.9), 0 0 26px rgba(var(--tone-rgb), 0.5);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
    }

    /* ========== STATE: shaking ========== */
    .shaking .neon-ring {
      animation: tremble 90ms linear infinite, neonPulse 0.3s ease-in-out infinite alternate;
    }

    .shaking .fog-1 { animation: fogSwirl1 0.9s ease-in-out infinite alternate; }
    .shaking .fog-2 { animation: fogSwirl2 0.7s ease-in-out infinite alternate; }
    .shaking .fog-3 { animation: fogSwirl1 0.6s ease-in-out infinite alternate-reverse; }

    @keyframes tremble {
      0%   { transform: translate(0, 0) rotate(0deg); }
      25%  { transform: translate(-5px, 2px) rotate(-2deg); }
      50%  { transform: translate(5px, -2px) rotate(2deg); }
      75%  { transform: translate(-3px, -4px) rotate(-1.5deg); }
      100% { transform: translate(3px, 4px) rotate(1.5deg); }
    }

    @keyframes fogSwirl1 {
      from { transform: translate(-12%, 12%) rotate(0deg) scale(1.2); }
      to   { transform: translate(12%, -12%) rotate(200deg) scale(0.9); }
    }

    @keyframes fogSwirl2 {
      from { transform: translate(12%, -12%) rotate(0deg) scale(0.9); }
      to   { transform: translate(-12%, 12%) rotate(-200deg) scale(1.2); }
    }

    @keyframes neonPulse {
      from {
        box-shadow: 0 0 15px rgba(255, 0, 204, 0.3), 0 0 30px rgba(255, 0, 204, 0.15), inset 0 0 15px rgba(255, 0, 204, 0.1);
      }
      to {
        box-shadow: 0 0 30px rgba(255, 0, 204, 0.75), 0 0 60px rgba(255, 0, 204, 0.4), 0 0 90px rgba(255, 0, 204, 0.2), inset 0 0 25px rgba(255, 0, 204, 0.25);
      }
    }

    /* ========== STATE: reveal, one movement per kind of answer ========== */
    .reveal .fog { opacity: 0.25; }
    .reveal #answer-text { opacity: 1; }

    /* yes: rises and lands with confidence */
    .tone-yes { --tone: var(--cyan); --tone-rgb: 0, 212, 255; }
    .tone-yes.reveal #answer-text { animation: revealYes 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.3) 0.25s both; }

    @keyframes revealYes {
      from { opacity: 0; transform: translateY(28%) scale(0.8); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* no: drops in and shakes its head */
    .tone-no { --tone: var(--pink); --tone-rgb: 255, 0, 204; }
    .tone-no.reveal #answer-text { animation: revealNo 0.9s ease-out 0.25s both; }

    @keyframes revealNo {
      0%   { opacity: 0; transform: translateY(-22%); }
      35%  { opacity: 1; transform: translateY(0); }
      50%  { transform: translateX(-7%); }
      65%  { transform: translateX(7%); }
      80%  { transform: translateX(-4%); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* maybe: comes into focus slowly and the fog never quite clears */
    .tone-maybe { --tone: var(--violet); --tone-rgb: 155, 92, 255; }
    .tone-maybe.reveal .fog { opacity: 0.6; }
    .tone-maybe.reveal #answer-text { animation: revealMaybe 1.6s ease-out 0.25s both, waver 3.5s ease-in-out 1.85s infinite alternate; }

    @keyframes revealMaybe {
      from { opacity: 0; filter: blur(10px); }
      to   { opacity: 1; filter: blur(0); }
    }

    @keyframes waver {
      from { opacity: 1; filter: blur(0); }
      to   { opacity: 0.72; filter: blur(0.8px); }
    }

    /* cheeky: pops in tilted, like a raised eyebrow */
    .tone-wink { --tone: #ffffff; --tone-rgb: 255, 214, 250; }
    .tone-wink.reveal #answer-text { animation: revealWink 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.5) 0.25s both; }

    @keyframes revealWink {
      from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
      to   { opacity: 1; transform: scale(1) rotate(-2deg); }
    }

    /* ========== FOOTER ========== */
    .footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-height: 112px;
    }

    .instruction {
      font-size: var(--t-body);
      font-weight: 500;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.4), 0 0 20px rgba(0, 212, 255, 0.2);
    }

    .instruction-sub {
      font-size: var(--t-small);
      color: var(--muted);
      line-height: 1.5;
      min-height: 1.5em;
    }

    /* ========== BUTTONS: two styles ========== */
    .btn {
      background: transparent;
      font-family: inherit;
      font-size: var(--t-small);
      font-weight: 500;
      padding: 12px 28px;
      min-height: 44px;
      border-radius: 50px;
      cursor: pointer;
      transition: box-shadow 0.3s, transform 0.2s;
    }

    .btn:active { transform: scale(0.96); }

    .btn:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .btn-quiet {
      margin-top: 8px;
      border: 1.5px solid rgba(0, 212, 255, 0.5);
      color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.2), 0 0 20px rgba(0, 212, 255, 0.1);
    }

    .btn-main {
      border: 2px solid var(--pink);
      color: var(--pink);
      font-size: var(--t-body);
      box-shadow: 0 0 15px rgba(255, 0, 204, 0.4), 0 0 30px rgba(255, 0, 204, 0.15), inset 0 0 15px rgba(255, 0, 204, 0.1);
    }

    [hidden] { display: none !important; }

    /* ========== INSTALL GUIDE (iOS) ========== */
    #install-guide {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(13, 0, 26, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px;
      text-align: center;
      animation: fadeIn 0.3s ease-out;
    }

    .guide-title {
      font-size: var(--t-answer);
      font-weight: 700;
      color: var(--pink);
      text-shadow: 0 0 10px rgba(255, 0, 204, 0.7);
    }

    .guide-steps {
      list-style: none;
      counter-reset: step;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: var(--t-body);
      color: var(--text);
      text-align: start;
      max-width: 320px;
    }

    .guide-steps li {
      counter-increment: step;
      display: flex;
      gap: 12px;
      align-items: baseline;
      line-height: 1.5;
    }

    .guide-steps li::before {
      content: counter(step);
      flex: 0 0 auto;
      color: var(--cyan);
      font-weight: 700;
    }

    .guide-steps strong { color: var(--cyan); font-weight: 600; }

    .guide-steps svg {
      width: 1.1em;
      height: 1.1em;
      vertical-align: -0.18em;
      stroke: var(--cyan);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* short screens (landscape phones, small windows) */
    @media (max-height: 520px) {
      :root { --ball: min(40vw, 46dvh, 240px); --t-title: 32px; }
      .subtitle { display: none; }
      #app { padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
      .footer { min-height: 0; gap: 4px; }
    }

    /* ========== REDUCED MOTION: fades only ========== */
    @media (prefers-reduced-motion: reduce) {
      .title,
      .ball-container,
      .neon-ring,
      .fog,
      .iris,
      .lid,
      .sky i,
      #install-guide {
        animation: none !important;
      }

      .lid { transition: none; }

      .reveal #answer-text {
        animation: fadeIn 0.6s ease-out both !important;
        opacity: 1;
        transform: none !important;
        filter: none !important;
      }

      .crystal-ball { transition: none; }
    }
  </style>
</head>
<body>

  <div class="sky" aria-hidden="true">
    <i style="left:12%;top:26%"></i>
    <i style="left:86%;top:31%;animation-delay:-1s;background:#00d4ff;box-shadow:0 0 6px #00d4ff"></i>
    <i style="left:78%;top:72%;animation-delay:-2s;background:#ff00cc;box-shadow:0 0 6px #ff00cc"></i>
    <i style="left:17%;top:76%;animation-delay:-.5s"></i>
    <i style="left:52%;top:20%;animation-delay:-1.6s;background:#9b5cff;box-shadow:0 0 6px #9b5cff"></i>
    <i style="left:92%;top:55%;animation-delay:-2.4s"></i>
  </div>

  <div id="app">

    <header>
      <h1 class="title">8BALL</h1>
      <p class="subtitle">לשאול. לנער. לגלות.</p>
    </header>

    <main class="stage">
      <div class="ball-container fresh" id="ball-container">
        <div class="neon-ring">
          <button type="button" class="crystal-ball" id="crystal-ball" aria-label="הכדור. לחיצה מביאה תשובה">
            <span class="fog fog-1"></span>
            <span class="fog fog-2"></span>
            <span class="fog fog-3"></span>
            <span class="eye"><span class="iris"><span class="pupil"></span></span></span>
            <span class="lid lid-top"></span>
            <span class="lid lid-bottom"></span>
            <span id="answer-text" aria-live="polite"></span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p class="instruction" id="instruction-text"></p>
      <p class="instruction-sub" id="instruction-sub"></p>
      <button type="button" class="btn btn-quiet" id="install-btn" hidden>להוסיף למסך הבית</button>
    </footer>

  </div>

  <!-- iOS: how to add to the home screen -->
  <div id="install-guide" role="dialog" aria-modal="true" aria-labelledby="guide-title" hidden>
    <p class="guide-title" id="guide-title">להוסיף למסך הבית</p>
    <ol class="guide-steps">
      <li><span>ללחוץ על כפתור השיתוף
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>
        בסרגל של ספארי</span></li>
      <li><span>לגלול למטה ולבחור <strong>הוסף למסך הבית</strong></span></li>
      <li><span>ללחוץ על <strong>הוסף</strong></span></li>
    </ol>
    <button type="button" class="btn btn-main" id="guide-close">הבנתי</button>
  </div>

  <script>
    (function () {
      'use strict';

      // ========== ANSWER POOL, grouped by kind ==========
      // The kind decides the colour and the movement of the answer.
      const answerGroups = {
        yes: [
          'כן',
          'בהחלט כן',
          'הכוכבים אומרים כן',
          'בלי שום ספק',
          'זה הולך לקרות',
          'אפשר לסמוך על זה',
          'בדרך אליך',
          'ללא ספק',
          'חד משמעית כן',
          'התשובה חיובית',
          'סימנים טובים',
          'יותר כן מלא',
          'הכל מצביע על כן',
          'בהחלט',
          'אני הייתי הולך על זה'
        ],
        no: [
          'לא',
          'ממש לא',
          'לא בחיים האלה',
          'בגלגול הבא אולי',
          'תשכחו מזה',
          'הכוכבים צוחקים',
          'לא הפעם',
          'שלילי לגמרי',
          'אפילו לא שווה לנסות',
          'חד משמעית לא'
        ],
        maybe: [
          'אולי מחר',
          'צריך לחשוב שוב',
          'שאלתם את אמא?',
          'הרוחות שותקות',
          'לא עכשיו',
          'תנערו שוב, לא שמעתי',
          'הערפל כבד מדי',
          'לשאול שוב מאוחר יותר',
          'לא ברור עדיין',
          'ממממ... לא בטוח',
          'קשה להגיד',
          'תחזרו מחר',
          'יכול להיות שכן ויכול להיות שלא'
        ],
        wink: [
          'התשובה כבר ידועה, לא?',
          'מספיק לשאול. הגיע הזמן לבצע',
          'התשובה בפנים, לא בכדור',
          'למה לשאול אותי? תסתכלו במראה',
          'אם צריך לשאול, כנראה כן',
          'תפסיקו לשאול ותתחילו לעשות',
          'שאלה טובה. תשובה? לא בטוח',
          'הלב יודע. הכדור רק מאשר',
          'אין תשובות קלות לשאלות טובות',
          'הכדור לא יודע הכל, אבל יודע את זה',
          'תנסו ותראו',
          'מי שלא מנסה לא יודע',
          'זה תלוי רק בך'
        ]
      };

      const answers = [];
      Object.keys(answerGroups).forEach(function (tone) {
        answerGroups[tone].forEach(function (text) {
          answers.push({ text: text, tone: tone });
        });
      });

      const TONE_CLASSES = ['tone-yes', 'tone-no', 'tone-maybe', 'tone-wink'];

      // ========== COPY ==========
      // "touch" is a phone or tablet, "mouse" is a computer.
      const copy = {
        idleShake:  { main: 'לנער חזק ולשאול בלב',   sub: 'אפשר גם לגעת בכדור' },
        idleTouch:  { main: 'לגעת בכדור ולשאול בלב', sub: 'חשבו על שאלה ותנו לכדור לענות' },
        idleMouse:  { main: 'ללחוץ על הכדור ולשאול בלב', sub: 'חשבו על שאלה ותנו לכדור לענות' },
        againShake: { main: 'לנער שוב לשאלה חדשה',   sub: '' },
        againTouch: { main: 'לגעת שוב לשאלה חדשה',   sub: '' },
        againMouse: { main: 'ללחוץ שוב לשאלה חדשה',  sub: '' }
      };

      // ========== DOM ==========
      const crystalBall = document.getElementById('crystal-ball');
      const answerText = document.getElementById('answer-text');
      const instructionText = document.getElementById('instruction-text');
      const instructionSub = document.getElementById('instruction-sub');
      const ballContainer = document.getElementById('ball-container');
      const installBtn = document.getElementById('install-btn');
      const installGuide = document.getElementById('install-guide');
      const guideClose = document.getElementById('guide-close');

      // ========== STATE ==========
      const isTouch = window.matchMedia('(pointer: coarse)').matches;
      const needsPermission =
        typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function';

      let lastAnswerIndex = -1;
      let isShaking = false;
      let cooldown = false;
      let shakeEvents = [];
      let hasAnswered = false;
      let motionOn = false;        // the sensor is listening
      let permissionAsked = false;

      // ========== INSTRUCTIONS ==========
      function mode() {
        if (!isTouch) return 'Mouse';
        return motionOn ? 'Shake' : 'Touch';
      }

      function renderInstructions() {
        const c = copy[(hasAnswered ? 'again' : 'idle') + mode()];
        instructionText.textContent = c.main;
        instructionSub.textContent = c.sub;
      }

      // ========== SHAKE DETECTION ==========
      const SHAKE_THRESHOLD = 8;
      const SHAKE_WINDOW = 600;
      const SHAKE_MS = 1500;
      const COOLDOWN_MS = 2000;
      let lastX = 0, lastY = 0, lastZ = 0;

      function handleMotion(event) {
        if (cooldown || isShaking) return;

        // Prefer acceleration (without gravity) if available
        let acc = event.acceleration;
        let useRaw = true;
        if (!acc || acc.x == null) {
          acc = event.accelerationIncludingGravity;
          useRaw = false;
        }
        if (!acc || acc.x == null) return;

        let netAccel;
        if (useRaw) {
          netAccel = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        } else {
          const deltaX = Math.abs(acc.x - lastX);
          const deltaY = Math.abs(acc.y - lastY);
          const deltaZ = Math.abs(acc.z - lastZ);
          netAccel = Math.sqrt(deltaX * deltaX + deltaY * deltaY + deltaZ * deltaZ);
          lastX = acc.x;
          lastY = acc.y;
          lastZ = acc.z;
        }

        if (netAccel > SHAKE_THRESHOLD) {
          const now = Date.now();
          shakeEvents.push(now);
          shakeEvents = shakeEvents.filter(function (t) {
            return now - t < SHAKE_WINDOW;
          });

          if (shakeEvents.length >= 2) {
            shakeEvents = [];
            triggerShake();
          }
        }
      }

      function startListening() {
        if (motionOn) return;
        motionOn = true;
        window.addEventListener('devicemotion', handleMotion, { passive: true });
        renderInstructions();
      }

      // ========== TRIGGER SHAKE ==========
      function triggerShake() {
        if (isShaking || cooldown) return;
        isShaking = true;
        cooldown = true;

        ballContainer.classList.remove('reveal', 'fresh');
        ballContainer.classList.add('shaking');

        if (navigator.vibrate) {
          try { navigator.vibrate([40, 60, 40]); } catch (e) { /* not allowed, fine */ }
        }

        setTimeout(function () {
          ballContainer.classList.remove('shaking');
          showAnswer();
          isShaking = false;
        }, SHAKE_MS);

        setTimeout(function () {
          cooldown = false;
        }, COOLDOWN_MS);
      }

      // ========== SHOW ANSWER ==========
      function showAnswer() {
        let index;
        do {
          index = Math.floor(Math.random() * answers.length);
        } while (index === lastAnswerIndex && answers.length > 1);

        lastAnswerIndex = index;
        const answer = answers[index];

        TONE_CLASSES.forEach(function (c) { ballContainer.classList.remove(c); });
        ballContainer.classList.add('tone-' + answer.tone);
        answerText.textContent = answer.text;

        // restart the reveal animation
        void ballContainer.offsetWidth;
        ballContainer.classList.add('reveal');

        hasAnswered = true;
        renderInstructions();
      }

      // ========== THE BALL IS ALWAYS A BUTTON ==========
      // The first press also asks for the motion sensor where the browser
      // wants a user gesture for that (iPhone). No separate permission screen.
      crystalBall.addEventListener('click', function () {
        if (needsPermission && !permissionAsked) {
          permissionAsked = true;
          DeviceMotionEvent.requestPermission()
            .then(function (state) {
              if (state === 'granted') startListening();
            })
            .catch(function () { /* stays a tap-only ball */ })
            .then(triggerShake);
          return;
        }
        triggerShake();
      });

      // ========== INSTALL ==========
      let deferredPrompt = null;

      function isIOS() {
        return /iPhone|iPad|iPod/.test(navigator.userAgent);
      }

      function isStandalone() {
        return window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches;
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.hidden = false;
      });

      installBtn.addEventListener('click', function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function () {
            deferredPrompt = null;
            installBtn.hidden = true;
          });
        } else {
          installGuide.hidden = false;
          guideClose.focus();
        }
      });

      function closeGuide() {
        installGuide.hidden = true;
        installBtn.focus();
      }

      guideClose.addEventListener('click', closeGuide);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !installGuide.hidden) closeGuide();
      });

      if (isIOS() && !isStandalone()) {
        installBtn.hidden = false;
      }

      window.addEventListener('appinstalled', function () {
        installBtn.hidden = true;
      });

      // ========== INIT ==========
      if (!needsPermission && typeof DeviceMotionEvent !== 'undefined' && isTouch) {
        startListening();
      }
      renderInstructions();

      // ========== SERVICE WORKER ==========
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {
          // SW registration failed, the app still works
        });
      }
    })();
  </script>
