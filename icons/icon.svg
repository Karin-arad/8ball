<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d001a"/>
      <stop offset="1" stop-color="#1a002e"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#5a3a8f"/>
      <stop offset="1" stop-color="#150a2a"/>
    </radialGradient>
    <radialGradient id="iris">
      <stop offset="0" stop-color="#9ff0ff"/>
      <stop offset="0.26" stop-color="#00d4ff"/>
      <stop offset="0.62" stop-color="#7b2fff"/>
      <stop offset="1" stop-color="#2a0f55"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#ff00cc" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="152" fill="url(#ball)"/>
  <circle cx="256" cy="256" r="100" fill="#00d4ff" opacity="0.45" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="94" fill="url(#iris)"/>
  <circle cx="256" cy="256" r="41" fill="#0d001a"/>
  <circle cx="240" cy="240" r="11" fill="#ffffff" opacity="0.9"/>
</svg>
